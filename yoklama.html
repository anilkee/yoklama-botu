<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PvP Yoklama Botu - Panel</title>
    <style>
        :root {
            --bg: #0a0707;
            --bg-card: #150d0d;
            --bg-input: #1c1212;
            --border: #3a1818;
            --accent: #ff2d3d;
            --accent-dim: #7a1620;
            --text: #f5eaea;
            --text-muted: #9c7373;
            --green: #2ecc71;
            --amber: #f0b84a;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 16px;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0; }
        .header h1 { font-size: 15px; margin: 0; color: var(--text); font-weight: 700; letter-spacing: .02em; }
        .header p { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

        .status-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .status-dot.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
        .status-dot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
        .status-dot.danger { background: #ff5252; box-shadow: 0 0 8px #ff0000; }

        .main-layout { display: flex; gap: 12px; flex: 1; min-height: 0; }
        .left-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        .right-col { width: 260px; display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; }

        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; flex-shrink: 0;
        }
        .card h2 {
            font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent);
            margin: 0 0 10px; font-weight: 700;
        }

        .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button {
            background: var(--accent); color: #0a0707; font-weight: 700;
            border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
            font-family: "Segoe UI", sans-serif; transition: opacity .15s, transform .1s;
        }
        button:hover { opacity: .85; }
        button:active { transform: scale(.97); }
        button:disabled { opacity: .4; cursor: default; }
        button.secondary { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
        button.small { padding: 6px 10px; font-size: 11px; }

        .scanStatus { font-size: 11px; color: var(--text-muted); }
        .summary { font-size: 11.5px; color: var(--text); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
        .summary b { color: var(--accent); }
        .summary .green-num { color: var(--green); font-weight: 700; }
        .summary .red-num { color: var(--accent); font-weight: 700; }

        .sched-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .sched-row input {
            width: 56px; padding: 7px 8px; border-radius: 6px;
            background: var(--bg-input); color: var(--text); border: 1px solid var(--border); font-size: 12px; text-align: center;
        }
        .sched-row label { font-size: 11px; color: var(--text-muted); }
        .countdown { font-size: 11.5px; color: var(--accent); font-weight: 700; margin-left: auto; }

        #errorBox {
            display: none; background: rgba(255,45,61,0.12); color: #ff6b6b;
            border: 1px solid rgba(255,45,61,0.4);
            padding: 10px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; flex-shrink: 0;
        }

        #listWrap { flex: 1; overflow-y: auto; min-height: 0; }
        #emptyState {
            display: none; text-align: center; color: var(--text-muted); font-size: 12.5px;
            padding: 40px 10px;
        }

        .row {
            display: flex; align-items: flex-start; gap: 10px;
            background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--border);
            border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
            transition: border-color .15s, background .15s;
        }
        .row.status-in { border-left-color: var(--green); }
        .row.status-out { border-left-color: var(--accent); }
        .row.selected { background: rgba(255,45,61,0.08); border-color: var(--accent); }

        .voiceDot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
        .voiceDot.in { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .voiceDot.out { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-input); flex-shrink: 0; }
        .info { flex: 1; min-width: 0; }
        .name { font-size: 12.5px; font-weight: 600; color: var(--text); }
        .name .tag { font-size: 10.5px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
        .voiceLabel { font-size: 11px; margin-top: 3px; font-weight: 600; }
        .voiceLabel.in { color: var(--green); }
        .voiceLabel.out { color: var(--accent); }
        .excuse { font-size: 11.5px; color: #d8c2c2; margin-top: 4px; word-break: break-word; }
        .reactions { margin-top: 5px; }
        .pill {
            display: inline-block; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 999px; padding: 2px 8px; font-size: 11px; margin-right: 4px; margin-bottom: 4px;
        }
        .pill.muted { color: var(--text-muted); }
        .tier { font-size: 10.5px; margin-top: 5px; }
        .muted { color: var(--text-muted); }

        .action { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .roleBtn { white-space: nowrap; }
        .roleMsg { font-size: 10.5px; text-align: right; }
        .roleMsg.ok { color: var(--green); }
        .roleMsg.error { color: #ff6b6b; }

        .selectBtns { display: flex; gap: 4px; }
        .selBtn {
            width: 24px; height: 24px; padding: 0; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .selBtn.selPlus { background: var(--bg-input); color: var(--accent); border: 1px solid var(--border); }
        .selBtn.selPlus.active { background: var(--accent); color: #0a0707; }
        .selBtn.selMinus { background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border); }

        .bulk-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .bulk-row textarea {
            flex: 1; min-width: 220px; resize: vertical; min-height: 34px;
            padding: 7px 9px; border-radius: 6px;
            background: var(--bg-input); color: var(--text); border: 1px solid var(--border); font-size: 12px;
            font-family: "Segoe UI", sans-serif;
        }
        .selectedCount { font-size: 11px; color: var(--text-muted); }
        .bulkProgress { font-size: 11px; color: var(--accent); margin-top: 6px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 50;
        }
        .modal-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 18px; width: 360px; max-width: calc(100vw - 40px);
        }
        .modal-card h3 { margin: 0 0 6px; font-size: 13px; color: var(--text); }
        .modal-sub { font-size: 11.5px; color: var(--text-muted); margin: 0 0 10px; line-height: 1.4; }
        .modal-card textarea {
            width: 100%; min-height: 70px; resize: vertical; padding: 8px 9px; border-radius: 6px;
            background: var(--bg-input); color: var(--text); border: 1px solid var(--border); font-size: 12px;
            font-family: "Segoe UI", sans-serif; box-sizing: border-box;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

        /* --- LOG PANELİ --- */
        .log-card { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-bottom: 0; }
        .log-card h2 { flex-shrink: 0; }
        #logList {
            flex: 1; overflow-y: auto; font-family: Consolas, "Courier New", monospace;
            font-size: 10.5px; line-height: 1.6; color: #c9a6a6;
        }
        .log-line { padding: 2px 0; border-bottom: 1px solid rgba(58,24,24,0.5); word-break: break-word; }
        .log-line .log-time { color: var(--text-muted); margin-right: 6px; }
        .log-line.log-hata { color: #ff6b6b; }
        .log-line.log-uyarı { color: var(--amber); }
        .log-line.log-yoklama { color: #e6c8c8; }
        .log-line.log-güncelleme { color: #8fb8ff; }
        .clearLogBtn { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>PvP Yoklama Botu</h1>
            <p>Sesde olanlar/olmayanlar, mazaretler ve uyarı yönetimi</p>
        </div>
        <div class="status-row">
            <span id="versionText" style="margin-right: 10px;"></span>
            <span class="status-dot warn" id="statusDot"></span>
            <span>Discord:</span>
            <span id="statusText">Bağlanıyor...</span>
        </div>
    </div>

    <div id="errorBox"></div>

    <div class="main-layout">
        <div class="left-col">
            <div class="card">
                <h2>Tarama</h2>
                <div class="toolbar">
                    <button id="scanBtn">Taramayı Başlat</button>
                    <span class="scanStatus" id="scanStatus">Henüz tarama yapılmadı - "Taramayı Başlat"a bas.</span>
                </div>
                <div class="summary" id="summaryText"></div>
            </div>

            <div class="card">
                <h2>Sonraki Taramayı Zamanla</h2>
                <div class="sched-row">
                    <label>Saat</label>
                    <input type="number" id="schedHours" min="0" max="72" value="0">
                    <label>Dakika</label>
                    <input type="number" id="schedMinutes" min="0" max="59" value="30">
                    <button class="secondary small" id="scheduleBtn">Zamanla</button>
                    <button class="secondary small" id="cancelScheduleBtn" style="display:none;">İptal Et</button>
                    <span class="countdown" id="countdownText"></span>
                </div>
            </div>

            <div class="card">
                <h2>Toplu Uyarı</h2>
                <div class="bulk-row">
                    <span class="selectedCount" id="selectedCount">0 kişi seçili</span>
                    <textarea id="bulkReason" placeholder="Uyarı sebebi..."></textarea>
                    <button id="bulkWarnBtn" disabled>Toplu Uyarı Ver</button>
                </div>
                <div class="bulkProgress" id="bulkProgress"></div>
            </div>

            <div id="listWrap">
                <div id="emptyState">Kontrol edilecek rollerde kimse bulunamadı.</div>
                <div id="list"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="card log-card">
                <h2>İşlem Kaydı</h2>
                <div id="logList"></div>
                <button class="secondary small clearLogBtn" id="clearLogBtn">Kaydı Temizle</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="reasonModalOverlay">
        <div class="modal-card">
            <h3>Uyarı Ver</h3>
            <p class="modal-sub" id="reasonModalSub"></p>
            <textarea id="reasonModalInput" placeholder="Uyarı sebebini yaz..."></textarea>
            <div class="modal-actions">
                <button class="secondary small" id="reasonModalCancel">İptal</button>
                <button class="small" id="reasonModalConfirm">Uyarı Ver</button>
            </div>
        </div>
    </div>

    <script>
        require('./yoklama-renderer.js');
    </script>
</body>
</html>
